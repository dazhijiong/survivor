<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>黑夜幸存者</title>
<meta name="description" content="黑夜幸存者：浏览器里直接玩的像素生存游戏，电脑和手机都能玩。">
<link rel="icon" type="image/png" href="icon.png">
<link rel="apple-touch-icon" href="icon.png">
<style>
:root { --bg: #0e0b0c; --fg: #ece4e6; --dim: #9a8f92; --accent: #e8a24a; }
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--fg);
  font-family: system-ui, -apple-system, "PingFang SC", "Microsoft YaHei", sans-serif; }
main { max-width: 960px; margin: 0 auto; padding: 24px 16px 48px; }
.cover { display: block; width: 100%; height: auto; border-radius: 8px; aspect-ratio: 16 / 9; }
h1 { font-size: 2rem; margin: 24px 0 8px; letter-spacing: .08em; }
p { color: var(--dim); line-height: 1.7; margin: 0 0 12px; }
.play { display: inline-block; margin: 12px 0 20px; padding: 14px 40px; border-radius: 6px;
  background: var(--accent); color: #1a1012; font-size: 1.25rem; font-weight: 700;
  text-decoration: none; }
.play:hover { filter: brightness(1.1); }
ul { color: var(--dim); line-height: 1.8; padding-left: 1.2em; }
</style>
</head>
<body>
<main>
<img class="cover" src="cover.jpg" alt="黑夜幸存者 封面" width="1920" height="1080">
<h1>黑夜幸存者</h1>
<p>在浏览器里直接玩，不用下载安装。电脑和手机都能玩。</p>
<a class="play" href="play/">开始游戏</a>
<ul>
<li>第一次打开要下载约 40 MB，网速慢的话请耐心等一会儿；之后再打开会快很多。</li>
<li>推荐使用新版 Chrome、Edge、Safari 或 Firefox。</li>
<li>手机上横屏体验更好。</li>
</ul>
</main>
</body>
</html>
